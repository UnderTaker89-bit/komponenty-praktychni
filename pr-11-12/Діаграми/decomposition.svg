<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#203b60"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="750" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#172b4d">IDEF0 A0 — Декомпозиція оформлення замовлення</text><rect x="220" y="230" width="260" height="130" fill="#f0f5fc" stroke="#203b60"/><text x="350.0" y="262" font-family="Arial" font-size="18" text-anchor="middle" fill="#172b4d">Перевірити кошик</text><text x="350.0" y="286" font-family="Arial" font-size="18" text-anchor="middle" fill="#172b4d">і наявність</text><text x="350.0" y="310" font-family="Arial" font-size="18" text-anchor="middle" fill="#172b4d">A1</text><rect x="650" y="390" width="260" height="130" fill="#f0f5fc" stroke="#203b60"/><text x="780.0" y="422" font-family="Arial" font-size="18" text-anchor="middle" fill="#172b4d">Прийняти оплату</text><text x="780.0" y="446" font-family="Arial" font-size="18" text-anchor="middle" fill="#172b4d">A2</text><rect x="1080" y="550" width="260" height="130" fill="#f0f5fc" stroke="#203b60"/><text x="1210.0" y="582" font-family="Arial" font-size="18" text-anchor="middle" fill="#172b4d">Зареєструвати</text><text x="1210.0" y="606" font-family="Arial" font-size="18" text-anchor="middle" fill="#172b4d">і передати замовлення</text><text x="1210.0" y="630" font-family="Arial" font-size="18" text-anchor="middle" fill="#172b4d">A3</text><path d="M20 285 L220 285" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="115" y="265" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Кошик і дані</text><path d="M480 300 L650 440" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="560" y="345" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Підтверджений кошик</text><path d="M910 460 L1080 600" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="995" y="500" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Оплачений кошик</text><path d="M1340 610 L1480 610" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="1410" y="580" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Замовлення</text><text x="1330" y="775" font-family="Arial" font-size="16" text-anchor="middle" fill="#172b4d">Підтвердження клієнту і заявка кур’єру</text><path d="M350 120 L350 230" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="350" y="95" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Наявність і правила продажу</text><path d="M780 120 L780 390" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="780" y="95" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Тарифи і політика оплати</text><path d="M1210 120 L1210 550" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="1210" y="95" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Правила доставки</text><path d="M350 840 L350 360" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="350" y="870" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Система магазину</text><path d="M780 840 L780 520" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="780" y="870" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Платіжний сервіс</text><path d="M1210 840 L1210 680" stroke="#203b60" fill="none" marker-end="url(#arrow)"/><text x="1210" y="870" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Система і оператор</text><text x="750" y="820" font-family="Arial" font-size="16" text-anchor="middle" fill="#172b4d">Відмова A1 або A2 → повідомлення про причину, без передавання на доставку</text><path d="M480 260 H540 V170 H1480" fill="none" stroke="#203b60" marker-end="url(#arrow)"/><path d="M910 420 H950 V170" fill="none" stroke="#203b60"/><text x="1370" y="152" font-family="Arial" font-size="15" text-anchor="middle" fill="#172b4d">Причина відмови A1 або A2</text></svg>
